<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // Zhiynl does not shop. He goes to the empty shop.
    if (sessionStorage.getItem("playerCharacter") === "Zhiynl") location.replace("emptyshop.html");
  </script>
  <script>
  try {
    const a = JSON.parse(localStorage.getItem("achievements") || "{}");
    if (a.preIndividuals && localStorage.getItem("priceNoticeSeen") !== "true") {
      location.replace("pricenotice.html");
    }
  } catch (e) {}
</script>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="shop.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<body>
  <div id="shop-container">
  <div id="achievement-popup" class="achievement-popup"></div>
  <div id="coin-display">🪙 COINS: <span id="coin-count">0</span></div>

    <!-- ===== Zhiynl Sprite ===== -->

    <!-- ===== FX Container ===== -->
    <div id="fx-container"></div>

    <!-- ===== Audio ===== -->
    <audio id="insult-sfx" src="assets/insult.mp3"></audio>
    <audio id="insufficient-sfx" src="assets/insufficient.mp3"></audio>
    <audio id="purchase-sfx" src="assets/purchase.mp3" preload="auto"></audio>
    <audio id="shop-music" autoplay loop></audio>
    <audio id="achievement-sfx" src="achievement.mp3" preload="auto"></audio>
    <audio id="hover-sfx" src="assets/shopbuttonhover.mp3" preload="auto"></audio>
    <audio id="click-sfx" src="assets/shopbuttonclick.mp3" preload="auto"></audio>

    <!-- ===== Buttons ===== -->
    <button id="talk-btn">💬 Conversation</button>
    <button id="buy-btn">🛒 BUY</button>
    <button id="back-btn" style="display: none;">← Back</button>
    <button id="exit-btn">GET THE FUCK OUT</button>
    <button id="mute-btn">🔊</button>

    <!-- ===== Shop Tabs ===== -->
<div id="shop-notebook">
  <div id="shop-tabs">
    <button class="tab-btn active" data-tab="items">Items</button>
    <button class="tab-btn" data-tab="characters">Characters</button>
    <button class="tab-btn" data-tab="misc">Misc</button>
  </div>

    <!-- ===== Shop Sections ===== -->
    <div id="shop-sections">
      <div class="shop-section" id="tab-items">
        <h3>Items:</h3>

          <li><button class="buy-item" data-id="Kill The Government" data-cost="1000" data-description="10x Cash Gain (Still does not stack)">Kill The Government - 1000 coins</button></li>
        </ul>
      </div>

      <div class="shop-section hidden" id="tab-characters">
        <h3>Characters:</h3>

          <li><button class="buy-item" data-cost="500" data-type="character" data-id="Kai" data-description='Heavy like a Brinks truck'>Kai Furukawa - 500 coins</button></li>


        </ul>
      </div>

      <div class="shop-section hidden" id="tab-misc">
        <h3>Misc:</h3>
        <ul>

          <li><button class="buy-item" data-cost="2500" data-type="misc" data-id="Golden Ticket" data-description="No need to thank me">Golden Ticket - 2500 coins</button></li>
          <li><button class="buy-item" data-cost="300" data-type="misc" data-id="Protection" data-description="Negates your next game over">Condom - 300 coins</button></li>

      </div>
    </div>

    <div id="item-preview" class="hidden"></div>
  </div>
  </div>
  <script src="coinCore.js"></script>
  <script src="shop.js"></script>
  <script src="conversation.js"></script>
  <script>
if (new URLSearchParams(location.search).has("dev")) {
  const b = document.createElement("button");
  b.textContent = "+1000 COINS";
  b.style.cssText = "position:fixed;bottom:10px;left:10px;z-index:99999;font-family:'Press Start 2P',cursive;font-size:9px;padding:8px;background:#0a0;color:#fff;border:2px solid #fff;cursor:pointer;";
  b.onclick = () => window.devGiveCoins(1000);
  document.body.appendChild(b);
}
</script>

</html>
