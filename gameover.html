<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NNNNNOOOOOOOOOOOO</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Press Start 2P', cursive;
      text-align: center;
      margin: 0;
      padding-top: 150px;
    }
    h1 {
      font-size: 80px;
      line-height: 1.1;
      margin: 0 20px 40px;
      user-select: none;
    }
    p {
      font-size: 16px;
      margin-bottom: 20px;
      color: #ff0000;
      user-select: none;
    }
    #final-score {
      color: #ff0000;
    }
    #coin-reward-details {
      font-size: 14px;
      color: #ffffff;
      margin-bottom: 30px;
      user-select: none;
    }

    /* buttons match the rest of the game (nav-btn style) */
    .btn-col {
      margin-top: 20px;
      display: inline-flex;
      flex-direction: column;
      gap: 20px;
    }
    button {
      font-family: 'Press Start 2P', cursive;
      width: 320px;
      padding: 20px 40px;
      font-size: 0.65em;
      background-color: #ba732a;
      border: 2px solid white;
      color: black;
      cursor: pointer;
      border-radius: 0;
      box-shadow: 0 0 0 3px black;
      transition: transform 0.1s ease, background 0.3s ease;
      user-select: none;
    }
    button:hover {
      background-color: #ffbe4d;
      transform: scale(1.04);
    }

    audio { display: none; }

    #fade-overlay {
      position: fixed; inset: 0; background: #000; opacity: 0;
      pointer-events: none; z-index: 99999; transition: opacity 0.5s ease;
    }
    #fade-overlay.active { opacity: 1; pointer-events: all; }

    .achievement-popup {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      background-color: white;
      color: black;
      padding: 20px;
      font-size: 10px;
      font-family: 'Press Start 2P', cursive;
      border: 3px solid #ba732a;
      box-shadow: 0 0 0 3px black;
      opacity: 0;
      pointer-events: none;
      transition: top 0.6s ease, opacity 0.4s ease;
      z-index: 999998;
      word-wrap: break-word;
      line-height: 1.2em;
      text-align: center;
      width: 600px;
      max-width: 80%;
    }
  </style>
</head>
<body>
  <h1>YOU GOT SHIT ON<br>YOUR DICK NNNNNOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOONOOOO</h1>
  <p>FINAL SCORE: <span id="final-score">0</span></p>
  <p id="coin-reward-details"></p>

  <div class="btn-col">
    <button data-go="game.html">Play Again</button>
    <button data-go="selection.html">Change Shyts</button>
    <button data-go="index.html">Main Menu</button>
  </div>

  <div id="achievement-popup" class="achievement-popup"></div>
  <div id="fade-overlay"></div>

  <audio id="badending-sound" src="assets/badending.mp3" preload="auto"></audio>
  <audio id="moyai-sound" src="assets/songs/moyai.mp3" preload="auto"></audio>
  <audio id="achievement-sound" src="achievement.mp3" preload="auto"></audio>

  <script>
  (() => {
    "use strict";

    // game.js already paid the coins; this page only displays the result
    const num = k => Math.max(0, parseInt(sessionStorage.getItem(k) || "0", 10) || 0);
    const score = num("lastScore");
    const coinsEarned = num("lastCoins");   // what was actually added to the wallet
    const mult = Math.max(1, num("lastMult")); // the real multiplier used (upgrades stack)
    const currentChar = sessionStorage.getItem("playerCharacter");

    document.getElementById("final-score").textContent = score;
    document.getElementById("coin-reward-details").textContent = mult > 1
      ? `Total Coins Received: ${coinsEarned} (x${mult} Mult)`
      : `Total Coins Received: ${coinsEarned}`;

    function showAchievement(name) {
      const popup = document.getElementById("achievement-popup");
      popup.textContent = `Achievement Unlocked: ${name}`;
      const sound = document.getElementById("achievement-sound");
      sound.currentTime = 0;
      sound.play().catch(() => {});
      popup.style.top = "50px";
      popup.style.opacity = 1;
      setTimeout(() => { popup.style.top = "-100px"; popup.style.opacity = 0; }, 3000);
    }

    // Kj heart attack
    if (sessionStorage.getItem("kjDeath") === "true") {
      document.querySelector("h1").textContent = "You straight up died from a heart attack";
      if (currentChar === "Kj") {
        const unlocked = JSON.parse(localStorage.getItem("achievements") || "{}");
        if (!unlocked.againstallodds) {
          unlocked.againstallodds = "new";
          localStorage.setItem("achievements", JSON.stringify(unlocked));
          showAchievement("Against All Odds");
        }
      }
      sessionStorage.removeItem("kjDeath");
    }

    // death music
    window.addEventListener("load", () => {
      let soundEl;
      if (currentChar === "Kj") {
        soundEl = new Audio("assets/songs/furelise.mp3");
      } else if (currentChar === "Dennis") {
        soundEl = new Audio("assets/songs/boysaliar.mp3");
      } else if (currentChar === "Kai") {
        soundEl = new Audio("assets/songs/ticktock.mp3");
      } else if (currentChar === "Zhiynl") {
        soundEl = new Audio("assets/songs/thechainsofhell.mp3");
      } else {
        const isBad = sessionStorage.getItem("badEnding") === "true";
        soundEl = document.getElementById(isBad ? "badending-sound" : "moyai-sound");
      }
      soundEl.volume = 0.7;
      soundEl.play().catch(() => {});
      document.addEventListener("click", () => {
        if (soundEl.paused) soundEl.play().catch(() => {});
      });
      sessionStorage.removeItem("badEnding");
    });

    // buttons
    let targets = [];
    try { targets = JSON.parse(sessionStorage.getItem("chosenTargets") || "[]"); } catch {}

    const hoverSound = new Audio("assets/buttonhover.mp3");
    const clickSound = new Audio("assets/buttonclick.mp3");
    hoverSound.volume = 0.5;
    clickSound.volume = 0.7;

    let leaving = false;
    document.querySelectorAll("button[data-go]").forEach(btn => {
      btn.addEventListener("mouseenter", () => {
        hoverSound.currentTime = 0;
        hoverSound.play().catch(() => {});
      });
      btn.addEventListener("click", () => {
        if (leaving) return;
        leaving = true;
        let url = btn.dataset.go;
        if (url === "game.html" && (!Array.isArray(targets) || targets.length !== 3)) url = "selection.html";
        clickSound.currentTime = 0;
        clickSound.play().catch(() => {});
        document.documentElement.style.overflow = "hidden";
        document.getElementById("fade-overlay").classList.add("active");
        setTimeout(() => { window.location.href = url; }, 500);
      });
    });
  })();
  </script>
</body>
</html>
