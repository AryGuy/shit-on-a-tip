<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Your Character</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <style>
    * { box-sizing: border-box; }

    body {
      background-color: #000;
      color: #fff;
      font-family: 'Press Start 2P', cursive;
      text-align: center;
      padding-top: 80px;
      margin: 0;
      background-image: repeating-linear-gradient(
        45deg,
        #1a1a1a,
        #1a1a1a 10px,
        #111 10px,
        #111 20px
      );
    }

    h1 {
      font-size: 1.2em;
      line-height: 2.2em;
      margin-bottom: 40px;
      text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000;
      background-color: white;
      color: black;
      display: inline-block;
      padding: 20px;
      border: 4px dashed #333;
      letter-spacing: 4px;
    }

    #character-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .char-btn {
      position: relative;
      width: 64px;
      height: 64px;
      background-color: #ba732a;
      border: 2px solid white;
      box-shadow: 0 0 0 3px black;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.3s ease, box-shadow 0.2s ease;
    }

    .char-btn:hover {
      background-color: #ffbe4d;
      transform: scale(1.1);
    }

    /* The one you are currently looking at in the wardrobe */
    .char-btn.selected {
      outline: 2px solid #ffbe4d;
      outline-offset: 3px;
    }

    .char-icon {
      width: 64px;
      height: 64px;
      image-rendering: pixelated;
    }

    #exit-btn,
    #confirm-btn {
      font-family: 'Press Start 2P', cursive;
      padding: 16px 32px;
      font-size: 0.65em;
      background-color: #444;
      border: 2px solid white;
      color: white;
      cursor: pointer;
      margin: 20px auto;
      width: 200px;
      box-shadow: 0 0 0 3px black;
      transition: background 0.3s ease, border-color 0.3s ease;
      display: block;
    }

    #exit-btn:hover,
    #confirm-btn:hover { background-color: #777; }

    #confirm-btn {
      position: relative;
      overflow: hidden;
    }
    #confirm-btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(
        120deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.6) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-20deg);
      animation: shine 5s infinite;
    }
    @keyframes shine {
      0%   { left: -75%; }
      8%   { left: 125%; }
      100% { left: 125%; }
    }

    /* Buttons sit at the bottom of the screen */
    #actions {
      position: fixed;
      bottom: 40px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 16px;
      z-index: 5;
    }
    #exit-btn,
    #confirm-btn { margin: 0; }
    #confirm-btn { width: 80px; padding: 16px 0; font-size: 1em; }
    /* keep its space when hidden so EXIT doesn't jump around */
    #confirm-btn.hidden { display: block !important; visibility: hidden; }

    #footer-text {
      position: fixed;
      bottom: 10px;
      left: 0;
      right: 0;
      font-size: 8px;
      color: #888;
      font-family: 'Press Start 2P', cursive;
    }

    #wardrobe {
      position: fixed;
      bottom: 0;
      right: 40px;
      width: 200px;
      height: 260px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 999;
    }

    #wardrobe-box {
      position: relative;
      bottom: 40px;
      width: 200px;
      height: 220px;
        background: black !important;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 15;
      border: 6px double black;
      box-shadow: 0 0 0 4px #333, inset 0 0 0 4px #999;
    }


#wardrobe-character,
#wardrobe-frozen {
  width: 95%;
  height: 95%;
  object-fit: contain;
  image-rendering: pixelated;
  mix-blend-mode: normal !important;
  background: #000 !important; /* same as box */
  filter: none !important;
  opacity: 1 !important;
}


    .shoot-text {
      position: absolute;
      left: 0;
      bottom: 135px;
      width: 200px;
      text-align: center;
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      line-height: 1.4em;
      color: #ffbe4d;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
      z-index: 1001;
    }

    .hidden { display: none !important; }
    #char-description {
  position: fixed;
  bottom: 280px;
  right: 40px;
  width: 200px;
  font-size: 10px;
  color: white;
  font-family: 'Press Start 2P', cursive;
  text-align: center;
  line-height: 1.4em;
  z-index: 1000;
}
  #char-name {
  position: fixed;
  bottom: 20px;
  right: 40px;
  width: 200px;
  font-size: 10px;
  color: #ffbe4d;
  font-family: 'Press Start 2P', cursive;
  text-align: center;
  z-index: 1000;
}
  </style>
</head>
<body>
  <h1>CHOOSE YOUR CHARACTER</h1>
  <div id="character-list"></div>
  <div id="char-description" class="hidden"></div>

  <div id="wardrobe">
    <div id="wardrobe-box">
      <img id="wardrobe-character" class="hidden" alt="Character">
    </div>
  </div>

  <div id="actions">
    <button id="exit-btn">EXIT</button>
    <button id="confirm-btn" class="hidden">✔</button>
  </div>

  <p id="char-name" class="hidden"></p>

  <audio id="hover-sfx" src="assets/buttonhover.mp3" preload="auto"></audio>
  <audio id="click-sfx" src="assets/buttonclick.mp3" preload="auto"></audio>
  <audio id="char-music" preload="auto" loop></audio>

  <script>
  const hoverSfx = document.getElementById('hover-sfx');
  const clickSfx = document.getElementById('click-sfx');
  const list = document.getElementById('character-list');
  const wardrobeChar = document.getElementById("wardrobe-character");
  const confirmBtn = document.getElementById("confirm-btn");
  const exitBtn = document.getElementById("exit-btn");
  const wardrobeBox = document.getElementById("wardrobe-box");
  const descBox = document.getElementById("char-description");
  const nameBox = document.getElementById("char-name");
  const charMusic = document.getElementById('char-music');
  let wardrobeTimeout;
  let typeWriterInterval;
  let frameInterval;
  let pendingChar = null;
  let confirming = false;

  const KJ_WALK_DURATION_MS = 5800; 
  const DEFAULT_WALK_DURATION_MS = 2600; 

  // ---- Zhiynl: his idle gif freezes on whatever frame it is at after 14s ----
  const ZHIYNL_FREEZE_MS = 14000;
  let freezeTimeout = null;
  let freezeToken = 0;
  let frozenCanvas = null;

  function unfreezeChar() {
    freezeToken++;                      // cancels any freeze still waiting on the gif to load
    clearTimeout(freezeTimeout);
    if (frozenCanvas) { frozenCanvas.remove(); frozenCanvas = null; }
    wardrobeChar.style.display = "";
  }

  function freezeChar() {
    if (!wardrobeChar.naturalWidth) return;
    const c = document.createElement("canvas");
    c.id = "wardrobe-frozen";
    c.width = wardrobeChar.naturalWidth;
    c.height = wardrobeChar.naturalHeight;
    c.getContext("2d").drawImage(wardrobeChar, 0, 0);   // grabs the frame showing right now
    wardrobeChar.style.display = "none";
    wardrobeChar.parentNode.appendChild(c);
    frozenCanvas = c;
  }

  function showIdle(name) {
    unfreezeChar();
    wardrobeChar.src = `./assets/chars/${name}-idle.gif`;
    if (name !== "Zhiynl") return;
    const token = freezeToken;
    wardrobeChar.addEventListener("load", () => {       // start counting once the gif is actually showing
      if (token !== freezeToken) return;
      freezeTimeout = setTimeout(freezeChar, ZHIYNL_FREEZE_MS);
    }, { once: true });
  }
  const FRAME_CHARS = {
    Win: {
      frames: ["todayiwant.png", "toturninto.png", "acat.png"],
      texts:  ["Oneul naneun", "Jjigeureojin chijeubori", "doel geoya"],
      ms: 1200,
    },
  };

  const KAI_IDLE     = './assets/chars/KaiIdle.png';
  const KAI_IDLE2    = './assets/chars/KaiIdle2.png';
  const KAI_SONG     = 'assets/songs/hotmilk.mp3';
  const KAI_TRIGGERS  = [5, 8, 11, 14.3, 18, 21, 24, 27];
  const KAI_FLASH_SEC = 1;    
  const KAI_LOOP_SEC  = 30;   
  let kaiRaf = null;
  let kaiLastFrame = null;
  let kaiActive = false;   // true while Kai's song has taken over the music
  let normalTime = 0;      // where the normal track was when Kai took over

  const trackList = ['assets/songs/playchar1.mp3','assets/songs/playchar2.mp3','assets/songs/playchar3.mp3'];
  const normalTrack = trackList[Math.floor(Math.random() * trackList.length)];
  charMusic.src = normalTrack;

  function startKai() {
    // stop the old frame loop, but do NOT hand the music back yet
    if (kaiRaf) cancelAnimationFrame(kaiRaf);
    kaiRaf = null;

    wardrobeChar.src = KAI_IDLE;
    kaiLastFrame = KAI_IDLE;

    // remember where the normal song was, only the first time Kai takes over
    if (!kaiActive) {
      normalTime = charMusic.currentTime;
      kaiActive = true;
    }

    if (!charMusic.src.endsWith(KAI_SONG)) charMusic.src = KAI_SONG;
    charMusic.currentTime = 0;   
    charMusic.volume = 0.4;
    charMusic.play().catch(() => {}); 

    const tick = () => {
      if (charMusic.currentTime >= KAI_LOOP_SEC) charMusic.currentTime = 0;
      const t = charMusic.currentTime;
      const flash = !charMusic.paused &&
        KAI_TRIGGERS.some(s => t >= s && t < s + KAI_FLASH_SEC);
      const want = flash ? KAI_IDLE2 : KAI_IDLE;
      if (want !== kaiLastFrame) {
        wardrobeChar.src = want;
        kaiLastFrame = want;
      }
      kaiRaf = requestAnimationFrame(tick);
    };
    tick();
  }

  function stopKai() {
    if (kaiRaf) cancelAnimationFrame(kaiRaf);
    kaiRaf = null;
    if (!kaiActive) return;
    kaiActive = false;

    // give the normal song back and jump to where it left off
    charMusic.src = normalTrack;
    charMusic.addEventListener('loadedmetadata', () => {
      charMusic.currentTime = normalTime;
    }, { once: true });
    charMusic.play().catch(() => {});
  }

  function shootText(text) {
    const el = document.createElement("div");
    el.className = "shoot-text";
    el.textContent = text;
    document.getElementById("wardrobe").appendChild(el);

    const dx = -(220 + Math.random() * 120);
    const dy = -60 + Math.random() * 100;
    el.animate(
      [
        { transform: "translate(0, 0) scale(0.8)", opacity: 1 },
        { transform: `translate(${dx}px, ${dy}px) scale(1.3)`, opacity: 0 },
      ],
      { duration: 1400, easing: "ease-out" }
    ).onfinish = () => el.remove();
  }

  function stopFrames() {
    clearInterval(frameInterval);
    document.querySelectorAll(".shoot-text").forEach((el) => el.remove());
  }

  function playFrames(name) {
    const { frames, texts = [], ms } = FRAME_CHARS[name];
    frames.forEach((f) => { new Image().src = `./assets/chars/${f}`; });
    let i = 0;

    const showFrame = () => {
      wardrobeChar.src = `./assets/chars/${frames[i]}`;
      if (texts[i]) shootText(texts[i]);
    };

    stopFrames();
    showFrame();
    frameInterval = setInterval(() => {
      i = (i + 1) % frames.length;
      showFrame();
    }, ms);
  }

  const characterDescriptions = {
    Sai: "PASSIVE: Double the reveal count and reveal both cards. Additionally, rolls to a fine shyt if revealed card is Lucy or Sans. Double gain on clapping Reveal++.",
    Andy: "PASSIVE: Clapping Sans gives you 5 score. Clapping Sans no longer ends the game.",
    Kj: "PASSIVE: Butterflies spawn randomly. Click on them to activate a random event. Ignoring butterflies gives 5 score.",
    Win: "PASSIVE: Clap his card to gain invulnerability for the next 3 claps. If you clap him while you're invulnerable, you get x10 points (this stacks if you use Win as a fine shyt).",
    Dennis: "PASSIVE: Gain an additional middle slot, cards clapped here gives 2 score at base. Successful shuffles multiplies the card value by 2x",
    Kai: "PASSIVE: Stacks hit twice as hard.",
    Zhiynl: "PASSIVE: A shotgun."
  };

  function typeWriterEffect(text, element, delay = 25, callback) {
    clearInterval(typeWriterInterval);
    let i = 0;
    element.textContent = '';
    typeWriterInterval = setInterval(() => {
      element.textContent += text[i] || '';
      i++;
      if (i >= text.length) {
        clearInterval(typeWriterInterval);
        if (callback) callback();
      }
    }, delay);
  }

  /* ---------------- Selection feedback ---------------- */
  function markSelected(name) {
    list.querySelectorAll(".char-btn").forEach((b) => {
      b.classList.toggle("selected", b.dataset.name === name);
    });
  }

  const unlockedCharacters = JSON.parse(localStorage.getItem("unlockedCharacters") || "[]");

  const savedCharRaw = sessionStorage.getItem("playerCharacter");
  const savedChar = unlockedCharacters.includes(savedCharRaw) ? savedCharRaw : null;

  if (unlockedCharacters.length === 0) {
    list.textContent = "ain't nobody wants to be your friend so you better consider buying ONE.";
  } else {
    unlockedCharacters.forEach(name => {
      const btn = document.createElement("button");
      btn.classList.add("char-btn");
      btn.dataset.name = name;

      const img = document.createElement("img");
      img.src = `./assets/chars/${name}.png`;
      img.alt = name;
      img.classList.add("char-icon");
      btn.appendChild(img);

      btn.addEventListener('pointerenter', () => {
        hoverSfx.currentTime = 0;
        hoverSfx.play().catch(() => {});
      });

      btn.addEventListener("click", (e) => {
        e.preventDefault();
        if (confirming) return;
        pendingChar = name; 
        console.log(`Selected character: ${name}`);

        clickSfx.currentTime = 0;
        clickSfx.play().catch(() => {});

        clearTimeout(wardrobeTimeout);
        stopFrames();
        stopKai();
        unfreezeChar();

        wardrobeBox.style.display = "flex";
        wardrobeChar.classList.remove("hidden");

        const description = characterDescriptions[name] || "A mysterious gooner.";
        descBox.classList.remove("hidden");
        typeWriterEffect(description, descBox);

        nameBox.textContent = name.toUpperCase();
        nameBox.classList.remove("hidden");

        markSelected(name);
        confirmBtn.classList.remove("hidden");

        if (FRAME_CHARS[name]) {
          playFrames(name);
        } else if (name === "Kai") {
          startKai();
        } else if (name === "Dennis") {
          wardrobeChar.src = `./assets/chars/Dennis-idle.gif`;
        } else {
          wardrobeChar.src = `./assets/chars/${name}-walk.gif`;

          if (name !== "Sai") {
            const idleSrc = `./assets/chars/${name}-idle.gif`;
            const preloadIdle = new Image();
            preloadIdle.src = idleSrc;

            let duration = (name === "Kj") ? KJ_WALK_DURATION_MS : DEFAULT_WALK_DURATION_MS;

            wardrobeTimeout = setTimeout(() => {
              showIdle(name);
            }, duration);
          }
        }
      });

      list.appendChild(btn);
    });
  }

  confirmBtn.addEventListener("pointerenter", () => {
    hoverSfx.currentTime = 0;
    hoverSfx.play().catch(() => {});
  });

  confirmBtn.addEventListener("click", (e) => {
    e.preventDefault();
    if (!pendingChar || confirming) return;
    confirming = true;
    clickSfx.currentTime = 0;
    clickSfx.play().catch(() => {});
    sessionStorage.setItem("playerCharacter", pendingChar);
    setTimeout(() => window.location.href = "index.html", 250);
  });

  exitBtn.addEventListener('pointerenter', () => {
    hoverSfx.currentTime = 0;
    hoverSfx.play().catch(() => {});
  });

  exitBtn.addEventListener('click', (e) => {
    e.preventDefault();
    clickSfx.currentTime = 0;
    clickSfx.play().catch(() => {});
    setTimeout(() => window.location.href = "index.html", 200);
  });

  document.addEventListener('click', () => {
    if (charMusic.paused) {
      charMusic.volume = 0;
      charMusic.play().then(() => {
        let vol = 0;
        const target = 0.4;
        const fade = setInterval(() => {
          vol += 0.05;
          if (vol >= target) { vol = target; clearInterval(fade); }
          charMusic.volume = vol;
        }, 200);
      }).catch(err => console.warn("Autoplay blocked:", err));
    }
  }, { once: true });

  if (savedChar) {
    wardrobeBox.style.display = "flex";
    if (FRAME_CHARS[savedChar]) playFrames(savedChar);
    else if (savedChar === "Kai") startKai();
    else showIdle(savedChar);
    wardrobeChar.classList.remove("hidden");

    const description = characterDescriptions[savedChar] || "A mysterious gooner.";
    descBox.classList.remove("hidden");
    typeWriterEffect(description, descBox);

    nameBox.textContent = savedChar.toUpperCase();
    nameBox.classList.remove("hidden");

    markSelected(savedChar);
  } else {
    wardrobeBox.style.display = "none";
    confirmBtn.classList.add("hidden");
    descBox.classList.add("hidden");
    nameBox.classList.add("hidden");
  }
</script>
</body>
</html>
